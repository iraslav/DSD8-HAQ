# milestone.yml -- pushing a milestone tag (m1..m5, final) makes conformance
# AUTHORITATIVE for that ref: the job fails the run if any test fails, and the
# conformance report is attached as an artifact. Grading reads the tagged commit.
name: milestone

on:
  push:
    tags: ["m[1-6]", "final"]

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - name: make all (lint + unit + conformance + extra)
        run: make all 2>&1 | tee certify.log
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-${{ github.ref_name }}
          path: |
            certify.log
            build/conformance/*.trace
